name: CI

# Builds Forcesmith with GCC, Clang and MSVC.
#
# NOTE on MSVC: the current CMake is Unix-oriented — IPOPT + MUMPS are built
# from source with autotools/make into .so files (cmake/FetchIPOPT.cmake), the
# warnings target hard-codes GCC/Clang flags (-march=native, -fsanitize, ...),
# and $ORIGIN RPATH is ELF-only. The MSVC job is therefore best-effort and is
# allowed to fail until the build is made portable. Remove `continue-on-error`
# once Windows is supported.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.compiler }} (Ubuntu)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-15
            cxx: g++-15
            pkg: g++-15
          - compiler: clang
            cc: clang-20
            cxx: clang++-20
            pkg: clang-20 clang-tools-20  # clang-scan-deps for C++23 module scanning
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      # ddx/einsum need GCC >= 14 / Clang >= 20; noble has neither 15 nor 20, so
      # pull them from the toolchain PPA and apt.llvm.org. g++-15 is installed for
      # both jobs so clang picks up libstdc++-15. Boost 1.92 is fetched by CMake.
      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache \
            libeigen3-dev libtbb-dev \
            gfortran pkg-config patch \
            libblas-dev liblapack-dev \
            g++-15 ${{ matrix.pkg }}

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-

      # The presets pin gcc-15 as a cache variable, which beats CC/CXX — override
      # it on the command line. MKL is not on the runner.
      - name: Configure
        run: >
          cmake --preset ci
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DFORCESMITH_USE_MKL=OFF

      # Template-heavy TUs (ddx/einsum/Boost) exhaust the runner's 16 GB at -j4 and
      # systemd-oomd SIGTERMs ninja ("interrupted by user", exit 143).
      - name: Build
        run: cmake --build --preset ci -j 2

      - name: Test
        run: ctest --preset ci

  windows:
    name: MSVC (Windows)
    runs-on: windows-2022
    # Best-effort: the build is not yet portable to MSVC (see header note).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # vcpkg (preinstalled at VCPKG_INSTALLATION_ROOT) supplies the manifest-less
      # dependencies. ipopt is available as a vcpkg port, so MKL/IPOPT from-source
      # are not used on this platform.
      - name: Install dependencies (vcpkg)
        shell: bash
        run: |
          vcpkg install eigen3 tbb coin-or-ipopt --triplet x64-windows

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFORCESMITH_USE_MKL=OFF
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
